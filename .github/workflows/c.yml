{
  "jobs": {
    "check": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v5"
        },
        {
          "uses": "dtolnay/rust-toolchain@stable",
          "with": {
            "components": "clippy",
            "targets": "wasm32-unknown-unknown"
          }
        },
        {
          "name": "c/ compiles as wasm32",
          "run": "cargo check --target wasm32-unknown-unknown --all-targets",
          "working-directory": "c"
        },
        {
          "name": "clippy says nothing",
          "run": "cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings",
          "working-directory": "c"
        },
        {
          "uses": "taiki-e/install-action@v2",
          "with": {
            "tool": "wasm-pack"
          }
        },
        {
          "name": "its tests pass as wasm32",
          "run": "wasm-pack test --node",
          "working-directory": "c"
        },
        {
          "name": "what C hands on is what it should",
          "run": "node --test src/front.test.js",
          "working-directory": "c"
        }
      ]
    },
    "deploy": {
      "concurrency": {
        "cancel-in-progress": false,
        "group": "c"
      },
      "if": "github.event_name == 'push'",
      "needs": [
        "check"
      ],
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v5"
        },
        {
          "uses": "dtolnay/rust-toolchain@stable",
          "with": {
            "targets": "wasm32-unknown-unknown"
          }
        },
        {
          "name": "Deploy c/ to C",
          "uses": "cloudflare/wrangler-action@v3",
          "with": {
            "accountId": "1a473b8ef17b2da06c81cfddb5da691a",
            "apiToken": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
            "workingDirectory": "c",
            "wranglerVersion": "4.156.0"
          }
        }
      ]
    }
  },
  "name": "c",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main"
      ]
    }
  }
}
