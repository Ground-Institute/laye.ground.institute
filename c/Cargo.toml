[package]
name = "laye-c"
version = "0.0.0"
edition = "2024"
description = "C: a laye peer on Cloudflare, in one Durable Object."
license = "MIT"

# Built for Cloudflare alone, by worker-build, with a lock of its own.
# laye's crates come from Ground-Institute/laye, at the commit C runs.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
laye-net = { git = "https://github.com/Ground-Institute/laye", rev = "dcac4ddadb15b5743d4977f5e429dcc705a16d97" }
laye-me = { git = "https://github.com/Ground-Institute/laye", rev = "dcac4ddadb15b5743d4977f5e429dcc705a16d97" }
worker = "=0.8.0"
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "=0.4.71"
web-sys = { version = "=0.3.98", features = ["WebSocket"] }
futures-timer = { version = "=3.0.4", features = ["wasm-bindgen"] }
base64 = "=0.22.1"
serde_json = "=1.0.143"

# The tests run as wasm, as C does: `cargo test --target wasm32-unknown-unknown`,
# with wasm-bindgen-test-runner as that target's runner.
[dev-dependencies]
wasm-bindgen-test = "=0.3.71"

[profile.release]
opt-level = "z"
lto = true
